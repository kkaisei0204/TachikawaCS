<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - 立川混雑シェア</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0 !important; padding: 0 !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Sans", sans-serif; }

    .auth-container {
      max-width: 700px;
      margin: 60px auto 100px;
      padding: 20px;
    }

    .auth-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .auth-header {
      padding: 24px;
      border-bottom: 2px solid #e0e0e0;
    }

    .auth-title {
      font-size: 24px;
      font-weight: 700;
      color: #000;
      margin: 0;
    }

    .auth-content {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    .form-input:focus {
      outline: none;
      border-color: #000;
    }

    .submit-button {
      width: 100%;
      padding: 14px;
      background: #000;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      font-family: inherit;
    }

    .submit-button:hover {
      background: #333;
    }

    .register-link {
      text-align: right;
      margin-top: 15px;
      font-size: 13px;
    }

    .register-link a {
      color: #2196F3;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 767px) {
      .auth-container {
        margin: 20px auto 80px;
        padding: 15px;
      }

      .auth-content {
        padding: 20px;
      }
    }

    @media (max-width: 375px) {
      .auth-container {
        padding: 10px;
        margin: 15px auto 80px;
      }

      .auth-content {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="app_name"><h1>立川混雑シェア</h1></div>
    <button class="mobile-menu-toggle" id="mobileMenuToggle">
      <span></span><span></span><span></span>
    </button>
    <div class="menu-outer01">
      <ul class="sample_menu_list01">
        <li><a href="{{ url_for('main.index') }}">トップ</a></li>
        <li><a href="{{ url_for('topics.topics_page') }}">トピックス</a></li>
        <li><a href="{{ url_for('main.shops_list') }}">飲食店</a></li>
      </ul>
    </div>
  </header>
  <div class="menu-overlay" id="menuOverlay"></div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-messages">
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">ログイン</h1>
      </div>

      <div class="auth-content">
        <form method="POST" action="{{ url_for('main.login') }}">
          <div class="form-group">
            <label class="form-label">ユーザーネーム</label>
            <input type="text" name="username" class="form-input" required autofocus>
          </div>

          <div class="form-group">
            <label class="form-label">パスワード</label>
            <input type="password" name="password" class="form-input" required>
          </div>

          <button type="submit" class="submit-button">ログインする</button>
          
          <div class="register-link">
            <a href="{{ url_for('main.register') }}">新規登録はこちら</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer>
    <p>©2025立川混雑シェア</p>
  </footer>

  <script>
    document.getElementById('mobileMenuToggle')?.addEventListener('click', function() {
      this.classList.toggle('active');
      document.querySelector('.menu-outer01').classList.toggle('active');
      document.getElementById('menuOverlay').classList.toggle('active');
    });

    document.getElementById('menuOverlay')?.addEventListener('click', function() {
      document.getElementById('mobileMenuToggle').classList.remove('active');
      document.querySelector('.menu-outer01').classList.remove('active');
      this.classList.remove('active');
    });
  </script>
</body>
</html>
