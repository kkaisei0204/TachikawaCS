<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン・新規登録 - 立川混雑シェア</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { margin: 0 !important; padding: 0 !important; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Sans", sans-serif; }

    .auth-container {
      max-width: 480px;
      margin: 60px auto;
      padding: 20px;
    }

    .auth-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* タブ */
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid #e0e0e0;
    }

    .auth-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      background: #f5f5f5;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      color: #666;
      transition: all 0.3s;
      font-family: inherit;
    }

    .auth-tab.active {
      background: white;
      color: #000;
      border-bottom: 3px solid #000;
    }

    /* コンテンツ */
    .auth-content {
      padding: 30px;
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    /* フォームグループ */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .form-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    .form-input:focus {
      outline: none;
      border-color: #000;
    }

    .form-textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      min-height: 100px;
      resize: vertical;
      font-family: inherit;
    }

    .form-textarea:focus {
      outline: none;
      border-color: #000;
    }

    /* 画像アップロード */
    .image-upload-container {
      text-align: center;
      margin-bottom: 25px;
    }

    .image-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #e0e0e0;
      margin: 0 auto 15px;
      overflow: hidden;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-preview-placeholder {
      color: #999;
      font-size: 14px;
    }

    .upload-button {
      display: inline-block;
      padding: 10px 20px;
      background: #000;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
      font-family: inherit;
    }

    .upload-button:hover {
      background: #333;
    }

    .file-input {
      display: none;
    }

    /* ボタン */
    .submit-button {
      width: 100%;
      padding: 14px;
      background: #000;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      font-family: inherit;
    }

    .submit-button:hover {
      background: #333;
    }

    .submit-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* ヘルプテキスト */
    .help-text {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }

    /* レスポンシブ */
    @media (max-width: 600px) {
      .auth-container {
        margin: 20px auto;
        padding: 10px;
      }

      .auth-content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="app_name"><h1>立川混雑シェア</h1></div>
    <button class="mobile-menu-toggle" id="mobileMenuToggle">
      <span></span><span></span><span></span>
    </button>
    <div class="menu-outer01">
      <ul class="sample_menu_list01">
        <li><a href="{{ url_for('main.index') }}">トップ</a></li>
        <li><a href="{{ url_for('topics.topics_page') }}">トピックス</a></li>
        <li><a href="{{ url_for('main.shops_list') }}">飲食店</a></li>
      </ul>
    </div>
  </header>
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- フラッシュメッセージ -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-messages">
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <div class="auth-container">
    <div class="auth-card">
      <!-- タブ -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">ログイン</button>
        <button class="auth-tab" onclick="switchTab('register')">新規登録</button>
      </div>

      <!-- コンテンツ -->
      <div class="auth-content">
        <!-- ログインフォーム -->
        <form class="auth-form active" id="loginForm" method="POST" action="{{ url_for('main.login') }}">
          <div class="form-group">
            <label class="form-label">ユーザーネーム</label>
            <input type="text" name="username" class="form-input" required autofocus>
          </div>

          <div class="form-group">
            <label class="form-label">パスワード</label>
            <input type="password" name="password" class="form-input" required>
          </div>

          <button type="submit" class="submit-button">ログインする</button>
        </form>

        <!-- 新規登録フォーム -->
        <form class="auth-form" id="registerForm" method="POST" action="{{ url_for('main.register') }}" enctype="multipart/form-data">
          <!-- 画像アップロード -->
          <div class="image-upload-container">
            <div class="image-preview" id="imagePreview">
              <span class="image-preview-placeholder">画像を選択</span>
            </div>
            <label class="upload-button" for="iconInput">画像を選択</label>
            <input type="file" id="iconInput" name="icon" class="file-input" accept="image/*" required>
            <p class="help-text">プロフィール画像を選択してください</p>
          </div>

          <div class="form-group">
            <label class="form-label">ユーザーネーム</label>
            <input type="text" name="username" class="form-input" required>
            <p class="help-text">半角英数字・アンダースコアのみ使用可能</p>
          </div>

          <div class="form-group">
            <label class="form-label">パスワード</label>
            <input type="password" name="password" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label">自己紹介（任意）</label>
            <textarea name="bio" class="form-textarea" placeholder="自己紹介を入力してください"></textarea>
          </div>

          <button type="submit" class="submit-button">新規登録する</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // タブ切り替え
    function switchTab(tab) {
      const tabs = document.querySelectorAll('.auth-tab');
      const forms = document.querySelectorAll('.auth-form');

      tabs.forEach(t => t.classList.remove('active'));
      forms.forEach(f => f.classList.remove('active'));

      if (tab === 'login') {
        tabs[0].classList.add('active');
        forms[0].classList.add('active');
      } else {
        tabs[1].classList.add('active');
        forms[1].classList.add('active');
      }
    }

    // 画像プレビュー
    document.getElementById('iconInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const preview = document.getElementById('imagePreview');
          preview.innerHTML = `<img src="${event.target.result}" alt="プレビュー">`;
        };
        reader.readAsDataURL(file);
      }
    });

    // モバイルメニュー
    document.getElementById('mobileMenuToggle')?.addEventListener('click', function() {
      this.classList.toggle('active');
      document.querySelector('.menu-outer01').classList.toggle('open');
      document.getElementById('menuOverlay').classList.toggle('active');
    });

    document.getElementById('menuOverlay')?.addEventListener('click', function() {
      document.getElementById('mobileMenuToggle').classList.remove('active');
      document.querySelector('.menu-outer01').classList.remove('open');
      this.classList.remove('active');
    });
  </script>
</body>
</html>
