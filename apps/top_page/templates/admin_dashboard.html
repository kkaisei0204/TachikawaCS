<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ダッシュボード | 立川混雑シェア</title>
  
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #f4f7f6;
      margin: 0;
      padding-top: 56px;
      padding-bottom: 56px;
      min-height: 100vh;
      font-family: "Noto Sans JP", sans-serif;
    }

    /* ヘッダー */
    header {
      background-color: #3a3f48;
      color: #ffffff;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 56px;
      z-index: 1100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .app_name h1 {
      margin: 0;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
    }

    /* フッター */
    footer {
      background-color: #3a3f48;
      color: #ffffff;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 56px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.3);
      font-size: 13px;
    }
    footer p { margin: 0; color: #ffffff !important; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 15px;
    }

    .admin-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .filter-area {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 15px;
    }
    .filter-select {
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid #ddd;
      font-size: 13px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    .kpi-title { font-size: 11px; color: #666; font-weight: bold; margin-bottom: 5px; }
    .kpi-value { font-size: 20px; font-weight: bold; color: #333; }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }
    .chart-panel {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 15px;
    }
    .chart-panel h3 { font-size: 14px; margin: 0 0 10px 0; color: #333; }
    .chart-container { position: relative; height: 250px; width: 100%; }

    .table-responsive { overflow-x: auto; }
    .admin-table { width: 100%; border-collapse: collapse; min-width: 500px; }
    .admin-table th { background: #f9f9f9; padding: 10px; text-align: left; font-size: 12px; color: #555; }
    .admin-table td { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }

    @media (max-width: 768px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .chart-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="app_name"><h1>立川混雑シェア</h1></div>
    <button class="mobile-menu-toggle" id="mobileMenuToggle">
      <span></span><span></span><span></span>
    </button>
    <div class="menu-outer01">
      <ul class="sample_menu_list01">
        <li><a href="{{ url_for('main.index') }}">トップ</a></li>
        <li><a href="{{ url_for('topics.topics_page') }}">トピックス</a></li>
        <li><a href="{{ url_for('main.shops_list') }}">飲食店</a></li>
        <li><a href="{{ url_for('main.admin_panel') }}">ユーザー管理</a></li>
        <li><a href="{{ url_for('main.admin_dashboard') }}">ダッシュボード</a></li>
        <li><a href="{{ url_for('main.logout') }}">ログアウト</a></li>
      </ul>
    </div>
  </header>
  <div class="menu-overlay" id="menuOverlay"></div>

  <div class="container">
    <div class="admin-card">
      
      <div class="filter-area">
        <label style="font-size:12px; margin-right:5px;">期間:</label>
        <select id="daysSelect" class="filter-select">
          <option value="7">直近7日</option>
          <option value="30">直近30日</option>
          <option value="90">直近90日</option>
          <option value="all">全期間</option>
        </select>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-title">総投稿数</div>
          <div class="kpi-value" id="kpiTotalPosts">-</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">期間内投稿</div>
          <div class="kpi-value" id="kpiPosts30">-</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">高評価数</div>
          <div class="kpi-value" id="kpiTotalRatings">-</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">AI一致率</div>
          <div class="kpi-value" id="kpiAiAcc">-</div>
        </div>
      </div>

      <div id="anomalyBox" style="background:#f0fff4; border:1px solid #c6f6d5; color:#2f855a; padding:10px; border-radius:6px; margin-bottom:20px; font-size:13px;">
        現在、急増アラートはありません。
      </div>

      <div class="chart-grid">
        <div class="chart-panel">
          <h3>店舗別投稿数 (全期間)</h3>
          <div class="chart-container"><canvas id="chartShopBar"></canvas></div>
        </div>
        <div class="chart-panel">
          <h3>投稿推移 (選択期間)</h3>
          <div class="chart-container"><canvas id="chartPostsLine"></canvas></div>
        </div>
        <div class="chart-panel">
          <h3>混雑レベル割合 (選択期間)</h3>
          <div class="chart-container"><canvas id="chartCrowdDonut"></canvas></div>
        </div>
      </div>

      <div style="margin-top:20px;">
        <h3 style="font-size:14px; margin-bottom:10px;">AI精度ワースト10</h3>
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr><th>店舗</th><th>一致率</th><th>件数</th></tr>
            </thead>
            <tbody id="aiWorstBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <footer>
    <p>© 2025 立川混雑シェアマップ</p>
  </footer>

  <script>
    const menuToggle = document.getElementById('mobileMenuToggle');
    const menuOuter = document.querySelector('.menu-outer01');
    const menuOverlay = document.getElementById('menuOverlay');
    if(menuToggle){
      const toggleMenu = () => {
        menuToggle.classList.toggle('active');
        menuOuter.classList.toggle('active');
        menuOverlay.classList.toggle('active');
      };
      menuToggle.addEventListener('click', toggleMenu);
      menuOverlay.addEventListener('click', toggleMenu);
    }

    const dashboard = {{ dashboard | default({}) | tojson | safe }};
    document.getElementById('kpiTotalPosts').textContent = dashboard.kpi.total_posts ?? '-';
    document.getElementById('kpiPosts30').textContent = dashboard.kpi.posts_last30 ?? '-';
    document.getElementById('kpiTotalRatings').textContent = dashboard.kpi.total_ratings ?? '-';
    const aiAcc = dashboard.kpi.overall_ai_accuracy;
    document.getElementById('kpiAiAcc').textContent = (aiAcc === null) ? '-' : aiAcc + '%';

    const params = new URLSearchParams(window.location.search);
    const ds = document.getElementById('daysSelect');
    ds.value = params.get('days') || '30';
    ds.onchange = () => {
      params.set('days', ds.value);
      window.location.search = params.toString();
    };

    const tbody = document.getElementById('aiWorstBody');
    const worst = dashboard.ai_worst || [];
    tbody.innerHTML = worst.length ? worst.map(x => `<tr><td>${x.shop}</td><td>${x.acc}%</td><td>${x.n}件</td></tr>`).join('') : '<tr><td colspan="3">データなし</td></tr>';

    Chart.defaults.maintainAspectRatio = false;
    function mkChart(id, type, labels, data, label) {
      const ctx = document.getElementById(id);
      if(!ctx) return;
      new Chart(ctx, {
        type: type,
        data: {
          labels: labels,
          datasets: [{ label: label, data: data, backgroundColor: 'rgba(102, 126, 234, 0.6)', borderColor: 'rgba(102, 126, 234, 1)', borderWidth: 1 }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }
    mkChart('chartShopBar', 'bar', dashboard.shop_bar.labels, dashboard.shop_bar.data, '投稿数');
    mkChart('chartPostsLine', 'line', dashboard.posts_line_30.labels, dashboard.posts_line_30.data, '推移');
    new Chart(document.getElementById('chartCrowdDonut'), {
      type: 'doughnut',
      data: {
        labels: dashboard.crowd_donut_30.labels,
        datasets: [{ data: dashboard.crowd_donut_30.data, backgroundColor: ['#48bb78', '#ecc94b', '#f56565'] }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  </script>
</body>
</html>
